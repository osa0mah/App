[build]
  ignore = "node scripts/skip-preview-deploy.mjs"
  command = "npm run build:web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  EXPO_NO_TELEMETRY = "1"

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
  force = true

[[redirects]]
  from = "/api/fatwas"
  to = "/.netlify/functions/fatwas"
  status = 200
  force = true

[[redirects]]
  from = "/api/hadiths"
  to = "/.netlify/functions/hadiths"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["generated/fatwa-catalog.json", "data/hadith/catalog.json.gz", "data/hadith/manifest.json"]

[[plugins]]
  package = "./netlify/plugins/fatwa-catalog-cache"

[[headers]]
  for = "/catalog/fatwas.json"
  [headers.values]
    Cache-Control = "no-cache"
